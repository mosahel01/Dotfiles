[font]
size = 13.0
offset = { x = -1, y = 1 } # x: line spacing, y: letter spacing

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "bold_italic"

[window]
padding.x = 0
padding.y = 0
opacity = 1.00
blur = true

[selection]
save_to_clipboard = true

# [colors.primary]
# background = "#000000"
# background = "#212122"
# foreground = "#ffffff"

[scrolling]
history = 10000
multiplier = 10

[env]
TERM = "xterm-256color"

